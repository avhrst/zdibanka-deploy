<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Friday Deploy</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1420);
    --fg: var(--tg-theme-text-color, #e8ecf4);
    --hint: var(--tg-theme-hint-color, #8a93a6);
    --accent: var(--tg-theme-button-color, #3d8bfd);
    --accent-fg: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #1a2131);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #game { display: block; width: 100vw; height: 100vh; height: var(--tg-viewport-stable-height, 100vh); }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between;
    padding: 10px 16px; font-weight: 700; font-size: 16px; pointer-events: none; }
  #hud .lives { letter-spacing: 2px; }
  #banner { position: fixed; top: 44px; left: 0; right: 0; text-align: center; font-weight: 800;
    font-size: 18px; color: var(--accent); opacity: 0; transition: opacity .3s; pointer-events: none; }
  .overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: color-mix(in srgb, var(--bg) 82%, transparent); padding: 16px; }
  .overlay.hidden { display: none; }
  .card { background: var(--card); border-radius: 18px; padding: 24px 20px; max-width: 360px; width: 100%;
    text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  .card h1 { margin: 0 0 4px; font-size: 26px; }
  .card .sub { color: var(--hint); margin: 0 0 16px; font-size: 14px; }
  .legend { text-align: left; font-size: 14px; line-height: 1.9; margin: 0 auto 18px; display: inline-block; }
  .big { font-size: 44px; font-weight: 800; margin: 6px 0; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px; font-size: 16px;
    font-weight: 700; background: var(--accent); color: var(--accent-fg); cursor: pointer; margin-top: 10px; }
  .btn.secondary { background: transparent; color: var(--accent); border: 2px solid var(--accent); }
  .ava { width: 20px; height: 20px; border-radius: 50%; vertical-align: -4px; object-fit: cover; }
  .rank { color: var(--hint); font-size: 14px; margin-bottom: 8px; }
  .lb { list-style: none; margin: 0 0 6px; padding: 0; text-align: left; max-height: 52vh; overflow-y: auto; }
  .lb li { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; font-size: 15px; }
  .lb li.me { background: color-mix(in srgb, var(--accent) 22%, transparent); font-weight: 700; }
  .lb .pos { width: 28px; text-align: center; color: var(--hint); font-weight: 700; }
  .lb .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb .sc { font-variant-numeric: tabular-nums; font-weight: 700; }
  .lbmsg { color: var(--hint); font-size: 14px; padding: 12px 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"><span id="score">0</span><span class="lives" id="lives"></span><span id="best"></span></div>
<div id="banner"></div>

<div class="overlay" id="start">
  <div class="card">
    <div style="font-size:52px">🚀</div>
    <h1 data-t="title"></h1>
    <p class="sub" data-t="tagline"></p>
    <div class="legend">
      🐛 🔥 <span data-t="bad"></span><br>
      ✅ ☕ <span data-t="good"></span><br>
      🧔 <span data-t="myr"></span><br>
      <img class="ava" src="tori.jpg" alt=""> <span data-t="duck"></span><br>
      👆 <span data-t="how"></span>
    </div>
    <button class="btn" id="play" data-t="play"></button>
    <button class="btn secondary lbopen" data-t="leaderboard"></button>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="card">
    <div style="font-size:52px">💥</div>
    <h1 data-t="over"></h1>
    <div class="big" id="final">0</div>
    <div class="rank" id="rank"></div>
    <div class="rank" id="bestline"></div>
    <button class="btn" id="again" data-t="again"></button>
    <button class="btn secondary lbopen" data-t="leaderboard"></button>
    <button class="btn secondary" id="share" data-t="share"></button>
  </div>
</div>

<div class="overlay hidden" id="lbview">
  <div class="card">
    <div style="font-size:40px">🏆</div>
    <h1 data-t="leaderboard"></h1>
    <p class="sub">IT Zdibanka</p>
    <ul class="lb" id="lblist"></ul>
    <div class="lbmsg" id="lbmsg"></div>
    <button class="btn" id="lbclose" data-t="close"></button>
  </div>
</div>

<script>
// Leaderboard API (Cloudflare Worker). Empty string disables the leaderboard.
const API = 'https://zdibanka-deploy-api.avhrst.workers.dev';
(() => {
  const tg = window.Telegram && Telegram.WebApp && Telegram.WebApp.initData !== undefined ? Telegram.WebApp : null;
  if (tg) { tg.ready(); tg.expand(); try { tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {} }

  // ---------- i18n ----------
  const lang = ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code) || navigator.language || 'en').slice(0, 2);
  const STR = {
    en: { title: 'Friday Deploy', tagline: 'Ship it before the weekend. What could go wrong?',
      bad: 'smash bugs & prod fires with the ball', good: 'catch commits & coffee — bonuses', duck: 'Tori — smashes a bunch of bugs', myr: 'Mÿr — takes one life',
      how: 'drag Roma, don’t drop the ball', play: 'Deploy to prod', over: 'Prod is down', again: 'Hotfix & retry', share: 'Share score',
      best: 'Best', newBest: '🏆 New personal best!', level: 'Sprint', speed: '⚡ more bugs, faster ball!',
      ranks: ['Intern who pushed to main', 'Junior dev', 'Middle dev', 'Senior dev', 'Tech lead', 'CTO', '10x engineer', 'Linus himself'],
      shareText: s => `I shipped ${s} points on Friday Deploy 🚀 Can you beat me?`,
      leaderboard: 'Leaderboard', close: 'Close', loading: 'Loading…', empty: 'No scores yet — be the first!',
      openInTg: 'Open the game from Telegram to see the leaderboard.', lbError: 'Leaderboard is unavailable right now.',
      yourRank: (r, b) => `Your place: #${r} (${b})` },
    uk: { title: 'Деплой у пʼятницю', tagline: 'Задеплой до вихідних. Що може піти не так?',
      bad: 'розбивай мʼячем баги та пожежі на проді', good: 'лови коміти та каву — бонуси', duck: 'Торі — розносить купу багів', myr: 'Mÿr — забирає одне життя',
      how: 'тягни Рому, не впусти мʼяч', play: 'Деплой на прод', over: 'Прод лежить', again: 'Хотфікс і ще раз', share: 'Поділитись',
      best: 'Рекорд', newBest: '🏆 Новий особистий рекорд!', level: 'Спринт', speed: '⚡ більше багів, швидший мʼяч!',
      ranks: ['Стажер, що пушнув у main', 'Джун', 'Мідл', 'Сеньйор', 'Техлід', 'CTO', '10x інженер', 'Сам Лінус'],
      shareText: s => `Я набрав ${s} балів у «Деплой у пʼятницю» 🚀 Перевершиш?`,
      leaderboard: 'Таблиця лідерів', close: 'Закрити', loading: 'Завантаження…', empty: 'Ще немає результатів — будь першим!',
      openInTg: 'Відкрий гру в Telegram, щоб побачити таблицю лідерів.', lbError: 'Таблиця лідерів зараз недоступна.',
      yourRank: (r, b) => `Твоє місце: #${r} (${b})` },
  };
  const T = STR[lang === 'uk' || lang === 'ru' ? 'uk' : 'en'];
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = T[el.dataset.t]; });
  document.title = T.title;

  // ---------- storage (Telegram CloudStorage w/ localStorage fallback) ----------
  const store = {
    get(k) {
      return new Promise(res => {
        if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
          tg.CloudStorage.getItem(k, (err, v) => res(err ? null : v));
        } else { try { res(localStorage.getItem(k)); } catch (e) { res(null); } }
      });
    },
    set(k, v) {
      if (tg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) tg.CloudStorage.setItem(k, String(v));
      else { try { localStorage.setItem(k, String(v)); } catch (e) {} }
    },
  };
  const haptic = (type) => { try { if (!tg || !tg.HapticFeedback) return;
    if (type === 'hit') tg.HapticFeedback.impactOccurred('heavy');
    else if (type === 'over') tg.HapticFeedback.notificationOccurred('error');
    else if (type === 'duck') tg.HapticFeedback.notificationOccurred('success');
    else tg.HapticFeedback.selectionChanged(); } catch (e) {} };

  // ---------- canvas ----------
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    if (player) player.y = H - 86;
  }
  window.addEventListener('resize', resize);
  if (tg) tg.onEvent('viewportChanged', resize);

  const css = getComputedStyle(document.documentElement);
  const C = { fg: css.getPropertyValue('--fg').trim() || '#e8ecf4', hint: css.getPropertyValue('--hint').trim() || '#8a93a6',
              accent: css.getPropertyValue('--accent').trim() || '#3d8bfd' };

  // ---------- game state ----------
  const playerImg = new Image(); playerImg.src = 'player.jpg';
  const toriImg = new Image(); toriImg.src = 'tori.jpg';
  // Drops that fall out of broken bricks.
  const DROPS = [
    { e: '✅', pts: 30, good: true, w: 40 },
    { e: '☕', pts: 10, good: true, wide: true, w: 25 },
    { e: '🦆', tori: true, w: 10, img: toriImg },
    { e: '🧔', good: false, w: 18, label: 'Mÿr', pop: 'MŸR!' },
  ];
  const DROP_CHANCE = 0.24, TOP = 64, BRICK_H = 26, GAP = 6, PADDLE_W = 96, WIDE_SEC = 10;
  let player, ball, bricks, items, parts, popups, score, lives, best = 0, t, speed, level, shake, running, combo, lastTs, wideT;

  function pick() {
    const total = DROPS.reduce((s, x) => s + x.w, 0);
    let r = Math.random() * total;
    for (const x of DROPS) { if ((r -= x.w) < 0) return x; }
    return DROPS[0];
  }

  function buildLevel() {
    const cols = Math.max(6, Math.min(10, Math.floor(W / 52)));
    const rows = Math.min(3 + level, 8);
    const bw = (W - GAP * (cols + 1)) / cols;
    bricks = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (level > 1 && Math.random() < 0.08) continue;           // a few holes on later sprints
      const fire = Math.random() < Math.min(0.5, 0.12 + level * 0.06);
      bricks.push({ x: GAP + c * (bw + GAP), y: TOP + r * (BRICK_H + GAP), w: bw, h: BRICK_H, fire, hp: fire ? 2 : 1 });
    }
    speed = Math.min(620, 380 + (level - 1) * 35);
    resetBall();
  }

  function resetBall() { ball = { x: player.x, y: player.y - 16, vx: 0, vy: 0, r: 8, stuck: 0.9 }; }

  function reset() {
    player = { x: W / 2, y: H - 86, tx: W / 2, w: PADDLE_W, size: 44 };
    items = []; parts = []; popups = [];
    score = 0; lives = 3; t = 0; level = 1; shake = 0; combo = 0; wideT = 0;
    buildLevel();
    hud();
  }

  function hud() {
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = '❤️'.repeat(Math.max(lives, 0)) + '🖤'.repeat(Math.max(3 - lives, 0));
    document.getElementById('best').textContent = `${T.best}: ${Math.max(best, score)}`;
  }

  function banner(text) {
    const b = document.getElementById('banner');
    b.textContent = text; b.style.opacity = 1;
    clearTimeout(banner._t); banner._t = setTimeout(() => b.style.opacity = 0, 1600);
  }

  function burst(x, y, color, n = 12) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, s = 60 + Math.random() * 180;
      parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .6, color });
    }
  }

  function mult() { return Math.min(5, 1 + Math.floor(combo / 4)); }

  function breakBrick(i, withDrop) {
    const b = bricks[i]; bricks.splice(i, 1);
    const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
    const gain = (b.fire ? 25 : 10) * mult();
    score += gain; popups.push({ x: cx, y: cy, text: `+${gain}`, life: .7 });
    burst(cx, cy, b.fire ? '#fb923c' : '#4ade80', 10);
    if (withDrop && Math.random() < DROP_CHANCE) {
      const type = pick();
      items.push({ type, size: 34, x: cx, y: cy, vy: 130 + Math.random() * 40 + level * 8, wob: Math.random() * 6, wobA: 0 });
    }
  }

  function loseLife(x, y, text) {
    lives--; combo = 0; shake = 0.35; haptic('hit');
    burst(x, y, '#f87171', 20); popups.push({ x, y, text, life: .9 });
    hud();
    if (lives <= 0) { gameOver(); return true; }
    return false;
  }

  function moveBall(dt) {
    if (ball.stuck > 0) {
      ball.stuck -= dt; ball.x = player.x; ball.y = player.y - 8 - ball.r;
      if (ball.stuck <= 0) { const a = (Math.random() - .5) * 0.9; ball.vx = speed * Math.sin(a); ball.vy = -speed * Math.cos(a); }
      return false;
    }
    const steps = Math.max(1, Math.ceil(speed * dt / 5)), h = dt / steps;
    for (let n = 0; n < steps; n++) {
      ball.x += ball.vx * h; ball.y += ball.vy * h;
      if (ball.x < ball.r) { ball.x = ball.r; ball.vx = Math.abs(ball.vx); }
      if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.vx = -Math.abs(ball.vx); }
      if (ball.y < 44 + ball.r) { ball.y = 44 + ball.r; ball.vy = Math.abs(ball.vy); }

      // paddle
      const top = player.y - 8;
      if (ball.vy > 0 && ball.y + ball.r >= top && ball.y - ball.r <= top + 14 && Math.abs(ball.x - player.x) <= player.w / 2 + ball.r) {
        const off = Math.max(-1, Math.min(1, (ball.x - player.x) / (player.w / 2)));
        const a = off * 1.05;                                       // up to ~60° from vertical
        ball.vx = speed * Math.sin(a); ball.vy = -speed * Math.cos(a); ball.y = top - ball.r;
        combo = 0; haptic('tap');
      }

      // bricks
      for (let i = 0; i < bricks.length; i++) {
        const b = bricks[i];
        const nx = Math.max(b.x, Math.min(ball.x, b.x + b.w)), ny = Math.max(b.y, Math.min(ball.y, b.y + b.h));
        const dx = ball.x - nx, dy = ball.y - ny;
        if (dx * dx + dy * dy > ball.r * ball.r) continue;
        const ox = Math.min(ball.x + ball.r - b.x, b.x + b.w - (ball.x - ball.r));
        const oy = Math.min(ball.y + ball.r - b.y, b.y + b.h - (ball.y - ball.r));
        if (ox < oy) { ball.vx = (ball.x < b.x + b.w / 2 ? -1 : 1) * Math.abs(ball.vx); }
        else { ball.vy = (ball.y < b.y + b.h / 2 ? -1 : 1) * Math.abs(ball.vy); }
        if (--b.hp <= 0) { combo++; breakBrick(i, true); } else { burst(nx, ny, '#fb923c', 5); }
        haptic('tap'); hud();
        break;
      }

      if (ball.y - ball.r > H) {
        if (loseLife(ball.x, H - 30, 'OOPS!')) return true;
        resetBall(); return false;
      }
    }
    return false;
  }

  function step(dt) {
    t += dt;
    if (wideT > 0) { wideT -= dt; if (wideT <= 0) player.w = PADDLE_W; }

    player.x += (player.tx - player.x) * Math.min(1, dt * 22);
    player.x = Math.max(player.w / 2, Math.min(W - player.w / 2, player.x));

    if (moveBall(dt)) return;

    if (!bricks.length) {
      const bonus = 100 * level; score += bonus; level++;
      popups.push({ x: W / 2, y: H / 2, text: `+${bonus}`, life: 1.2 });
      banner(`${T.level} ${level} — ${T.speed}`); haptic('duck');
      items = []; buildLevel(); hud();
    }

    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt; it.wob += dt * 3;
      const top = player.y - 8;
      if (it.y + it.size * 0.4 >= top && it.y - it.size * 0.4 <= top + 14 && Math.abs(it.x - player.x) <= player.w / 2 + it.size * 0.4) {
        items.splice(i, 1);
        if (it.type.tori) {
          // Tori fixes things: smashes up to 8 of the lowest bricks.
          const order = bricks.map((b, k) => k).sort((a, b) => bricks[b].y - bricks[a].y || Math.random() - .5).slice(0, 8).sort((a, b) => b - a);
          for (const k of order) breakBrick(k, false);
          burst(it.x, it.y, '#ffd84a', 24); haptic('duck');
        } else if (it.type.good) {
          score += it.type.pts; popups.push({ x: it.x, y: it.y, text: `+${it.type.pts}`, life: .8 });
          if (it.type.wide) { player.w = PADDLE_W * 1.6; wideT = WIDE_SEC; }
          burst(it.x, it.y, '#4ade80', 10); haptic('tap');
        } else if (loseLife(it.x, it.y, it.type.pop)) return;
        hud();
        continue;
      }
      if (it.y > H + it.size) items.splice(i, 1);
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = popups.length - 1; i >= 0; i--) {
      const p = popups[i]; p.y -= 50 * dt; p.life -= dt; if (p.life <= 0) popups.splice(i, 1);
    }
    shake = Math.max(0, shake - dt);
  }

  // background "code rain" lines
  const codeLines = ['git push --force', 'if (works) dontTouch()', 'console.log("here")', 'TODO: fix later',
    'sudo rm -rf node_modules', 'it works on my machine', '// no idea why this works', 'npm install --legacy-peer-deps',
    'SELECT * FROM prod', 'while(true) coffee++', 'catch (e) {}', 'git commit -m "fix"', 'docker compose up -d'];
  const bg = Array.from({ length: 14 }, (_, i) => ({ text: codeLines[i % codeLines.length], x: Math.random(), y: Math.random(), v: 0.02 + Math.random() * 0.03 }));

  function draw(dt) {
    ctx.save();
    ctx.clearRect(0, 0, W, H);
    if (shake > 0) ctx.translate((Math.random() - .5) * 14 * shake / .35, (Math.random() - .5) * 14 * shake / .35);

    ctx.globalAlpha = 0.09; ctx.fillStyle = C.fg; ctx.font = '13px ui-monospace, Menlo, monospace'; ctx.textAlign = 'left';
    for (const l of bg) { l.y += l.v * dt * (running ? 1 + level * 0.2 : 0.5); if (l.y > 1.05) { l.y = -0.05; l.x = Math.random(); }
      ctx.fillText(l.text, l.x * (W - 120), l.y * H); }
    ctx.globalAlpha = 1;

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // bricks
    const rr = (x, y, w, h, r) => { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); };
    if (bricks) for (const b of bricks) {
      ctx.fillStyle = b.fire ? (b.hp > 1 ? 'rgba(251,146,60,0.55)' : 'rgba(251,146,60,0.28)') : 'rgba(74,222,128,0.30)';
      rr(b.x, b.y, b.w, b.h, 7); ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = b.fire ? '#fb923c' : '#4ade80'; ctx.stroke();
      ctx.font = '17px serif'; ctx.fillStyle = C.fg; ctx.fillText(b.fire ? '🔥' : '🐛', b.x + b.w / 2, b.y + b.h / 2 + 1);
    }

    // falling drops
    for (const it of items) {
      const ix = it.x, im = it.type.img;
      if (im && im.complete && im.naturalWidth) {
        const r = it.size * 0.62;
        ctx.save(); ctx.beginPath(); ctx.arc(ix, it.y, r, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(im, ix - r, it.y - r, r * 2, r * 2); ctx.restore();
        ctx.lineWidth = 3; ctx.strokeStyle = '#ffd84a'; ctx.beginPath(); ctx.arc(ix, it.y, r, 0, Math.PI * 2); ctx.stroke();
      } else if (it.type.label) {
        const r = it.size * 0.62;
        ctx.fillStyle = 'rgba(248,113,113,0.22)'; ctx.beginPath(); ctx.arc(ix, it.y, r, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#f87171'; ctx.stroke();
        ctx.font = `${it.size * 0.78}px serif`; ctx.fillStyle = C.fg; ctx.fillText(it.type.e, ix, it.y + 1);
        ctx.font = 'bold 12px sans-serif'; ctx.fillStyle = '#f87171'; ctx.fillText(it.type.label, ix, it.y + r + 10);
      } else { ctx.font = `${it.size}px serif`; ctx.fillStyle = C.fg; ctx.fillText(it.type.e, ix, it.y); }
    }

    if (player) {
      // paddle bar, with Roma holding it from below
      const top = player.y - 8;
      ctx.fillStyle = wideT > 0 ? '#4ade80' : C.accent;
      rr(player.x - player.w / 2, top, player.w, 14, 7); ctx.fill();
      const r = player.size / 2, cy = player.y + 10 + r;
      if (playerImg.complete && playerImg.naturalWidth) {
        ctx.save(); ctx.beginPath(); ctx.arc(player.x, cy, r, 0, Math.PI * 2); ctx.clip();
        ctx.drawImage(playerImg, player.x - r, cy - r, r * 2, r * 2); ctx.restore();
        ctx.lineWidth = 3; ctx.strokeStyle = C.accent; ctx.beginPath(); ctx.arc(player.x, cy, r, 0, Math.PI * 2); ctx.stroke();
      } else { ctx.font = `${player.size}px serif`; ctx.fillText('💻', player.x, cy); }
      if (mult() > 1) { ctx.font = 'bold 13px sans-serif'; ctx.fillStyle = C.accent; ctx.fillText(`x${mult()} combo`, player.x, top - 26); }
    }

    if (ball) {
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = C.accent; ctx.stroke();
    }

    for (const p of parts) { ctx.globalAlpha = Math.max(0, p.life / .6); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
    ctx.globalAlpha = 1;
    ctx.font = 'bold 18px sans-serif';
    for (const p of popups) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.text.startsWith('+') || p.text.startsWith('🦆') ? '#4ade80' : '#f87171'; ctx.fillText(p.text, p.x, p.y); }
    ctx.restore();
  }

  function loop(ts) {
    const dt = Math.min(0.05, (ts - (lastTs || ts)) / 1000); lastTs = ts;
    if (running) step(dt);
    draw(dt);
    requestAnimationFrame(loop);
  }

  // ---------- input ----------
  function move(clientX) { if (player) player.tx = clientX; }
  cv.addEventListener('pointerdown', e => move(e.clientX));
  cv.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons || e.pressure > 0) move(e.clientX); });
  window.addEventListener('keydown', e => { if (!player) return;
    if (e.key === 'ArrowLeft') player.tx = player.x - 70; if (e.key === 'ArrowRight') player.tx = player.x + 70; });

  // ---------- flow ----------
  function start() {
    document.getElementById('start').classList.add('hidden');
    document.getElementById('over').classList.add('hidden');
    reset(); running = true; haptic('tap');
  }

  function gameOver() {
    running = false; haptic('over');
    const isBest = score > best;
    if (isBest) { best = score; store.set('best', best); }
    const rank = T.ranks[Math.min(T.ranks.length - 1, Math.floor(score / 400))];
    document.getElementById('final').textContent = score;
    document.getElementById('rank').textContent = rank;
    document.getElementById('bestline').textContent = isBest && score > 0 ? T.newBest : `${T.best}: ${best}`;
    document.getElementById('over').classList.remove('hidden');
    hud();
    submitScore(score, t);
  }

  // ---------- leaderboard ----------
  const initData = tg && tg.initData;
  function api(path, opts = {}) {
    return fetch(API + path, { ...opts, headers: { 'Content-Type': 'application/json', 'X-Init-Data': initData, ...(opts.headers || {}) } })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  let lastBoard = null;
  function renderBoard(data) {
    const list = document.getElementById('lblist'), msg = document.getElementById('lbmsg');
    list.innerHTML = '';
    if (!data.top.length) { msg.textContent = T.empty; return; }
    for (const r of data.top) {
      const li = document.createElement('li'); if (r.me) li.className = 'me';
      const medal = ['🥇', '🥈', '🥉'][r.rank - 1] || r.rank;
      li.innerHTML = '<span class="pos"></span><span class="nm"></span><span class="sc"></span>';
      li.children[0].textContent = medal; li.children[1].textContent = r.name; li.children[2].textContent = r.best;
      list.appendChild(li);
    }
    msg.textContent = data.me && !data.top.some(r => r.me) ? T.yourRank(data.me.rank, data.me.best) : '';
  }
  function openBoard() {
    document.getElementById('lbview').classList.remove('hidden');
    const msg = document.getElementById('lbmsg');
    document.getElementById('lblist').innerHTML = '';
    if (!API || !initData) { msg.textContent = T.openInTg; return; }
    if (lastBoard) renderBoard(lastBoard); else msg.textContent = T.loading;
    api('/top').then(d => { lastBoard = d; renderBoard(d); }).catch(() => { if (!lastBoard) msg.textContent = T.lbError; });
  }
  function submitScore(s, duration) {
    if (!API || !initData || s <= 0) return;
    api('/score', { method: 'POST', body: JSON.stringify({ score: s, duration }) })
      .then(d => { lastBoard = d; if (d.me) document.getElementById('rank').textContent += ` · #${d.me.rank}`; })
      .catch(() => {});
  }
  document.querySelectorAll('.lbopen').forEach(b => b.onclick = openBoard);
  document.getElementById('lbclose').onclick = () => document.getElementById('lbview').classList.add('hidden');

  function share() {
    const url = "https://t.me/zdibanka_deploy_bot/deploy";
    const link = `https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(T.shareText(score))}`;
    if (tg && tg.openTelegramLink) tg.openTelegramLink(link); else window.open(link, '_blank');
  }

  document.getElementById('play').onclick = start;
  document.getElementById('again').onclick = start;
  document.getElementById('share').onclick = share;

  resize(); reset(); running = false;
  store.get('best').then(v => { best = parseInt(v, 10) || 0; hud(); });
  requestAnimationFrame(loop);
})();
</script>
</body>
